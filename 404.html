  </head>
  <body>
    <button class="theme-toggle-float" id="theme-toggle-float" aria-label="Toggle dark mode" title="Toggle dark mode"><span aria-hidden="true">🌙</span></button>
  <script>
  (function() {
    const toggle = document.getElementById('theme-toggle-float');
    const icon = toggle ? toggle.querySelector('span') : null;
    const root = document.documentElement;
    const stored = localStorage.getItem('theme');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    const isDark = stored ? stored === 'dark' : prefersDark;

    const applyTheme = (dark) => {
      root.setAttribute('data-theme', dark ? 'dark' : 'light');
      if (icon) icon.textContent = dark ? '☀️' : '🌙';
    };

    applyTheme(isDark);

    if (toggle) {
      toggle.addEventListener('click', () => {
        const current = root.getAttribute('data-theme') === 'dark';
        applyTheme(!current);
        localStorage.setItem('theme', !current ? 'dark' : 'light');
      });
    }
  })();
  </script>
  <div class="code">404</div>
  <h1>Page Not Found</h1>
  <p>This page doesn't exist or may have moved. Let's get you back to the action.</p>
  <a href="/">← Back to Home</a>
</body>
