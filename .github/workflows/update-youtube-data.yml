name: Update YouTube Data

on:
  schedule:
    # Run once per day at 9:00 PM UTC
    - cron: '0 21 * * *'

  # Allow manual trigger from Actions tab
  workflow_dispatch:

  # Optional: trigger immediately when a new upload is detected externally
  repository_dispatch:
    types: [youtube-upload]

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install axios

      - name: Fetch YouTube data (OPTIMIZED)
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_API_KEY_FALLBACK: ${{ secrets.YOUTUBE_API_KEY_FALLBACK }}
        run: |
          # Guard execution at runtime to avoid workflow validation errors when secrets are not present
          if [ -n "${{ secrets.YOUTUBE_API_KEY }}" ] || [ -n "${{ secrets.YOUTUBE_API_KEY_FALLBACK }}" ]; then
            echo "🚀 Found YouTube API key — running fetch script"
            node .github/scripts/fetch-youtube-data.js
          else
            echo "⚠️  No YouTube API keys configured — skipping fetch step"
          fi

      - name: Update SEO metadata
        run: npm run update-seo-data

      - name: Check which files changed
        id: check_changes
        run: |
          echo "Checking git status..."
          git diff --name-only
          
          # Check if any files are staged/modified
          if git diff --quiet; then
            echo "files_changed=false" >> $GITHUB_OUTPUT
            echo "video_changed=false" >> $GITHUB_OUTPUT
            echo "stats_changed=false" >> $GITHUB_OUTPUT
            echo "state_changed=false" >> $GITHUB_OUTPUT
          else
            echo "files_changed=true" >> $GITHUB_OUTPUT
            
            # Check specific files
            if git diff --name-only | grep -q "^videos.json"; then
              echo "video_changed=true" >> $GITHUB_OUTPUT
            else
              echo "video_changed=false" >> $GITHUB_OUTPUT
            fi
            
            if git diff --name-only | grep -q "^channel.json"; then
              echo "stats_changed=true" >> $GITHUB_OUTPUT
            else
              echo "stats_changed=false" >> $GITHUB_OUTPUT
            fi

            if git diff --name-only | grep -q "^sitemap.xml"; then
              echo "sitemap_changed=true" >> $GITHUB_OUTPUT
            else
              echo "sitemap_changed=false" >> $GITHUB_OUTPUT
            fi
            
            if git diff --name-only | grep -q "^\.github/scripts/state\.json"; then
              echo "state_changed=true" >> $GITHUB_OUTPUT
            else
              echo "state_changed=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Commit and push changes
        if: steps.check_changes.outputs.files_changed == 'true'
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          
          # Prepare commit message based on what changed
          if [ "${{ steps.check_changes.outputs.video_changed }}" == "true" ] && [ "${{ steps.check_changes.outputs.stats_changed }}" == "true" ]; then
            MESSAGE="🤖 Auto-update: New video + updated stats ($(date -u +'%Y-%m-%d %H:%M:%S UTC'))"
          elif [ "${{ steps.check_changes.outputs.video_changed }}" == "true" ]; then
            MESSAGE="📹 Auto-update: New video detected ($(date -u +'%Y-%m-%d %H:%M:%S UTC'))"
          elif [ "${{ steps.check_changes.outputs.sitemap_changed }}" == "true" ]; then
            MESSAGE="🗺️ Auto-update: Sitemap refreshed ($(date -u +'%Y-%m-%d %H:%M:%S UTC'))"
          else
            MESSAGE="📊 Auto-update: Subscriber stats refreshed ($(date -u +'%Y-%m-%d %H:%M:%S UTC'))"
          fi
          
          git add -A
          git commit -m "$MESSAGE"
          git push

      - name: Deploy summary
        if: steps.check_changes.outputs.files_changed == 'true'
        run: |
          echo "📊 UPDATE DEPLOYED"
          echo "================="
          echo "Video updated: ${{ steps.check_changes.outputs.video_changed }}"
          echo "Stats updated: ${{ steps.check_changes.outputs.stats_changed }}"
          echo "Sitemap updated: ${{ steps.check_changes.outputs.sitemap_changed }}"
          echo "State updated: ${{ steps.check_changes.outputs.state_changed }}"
          echo "Cloudflare Pages will auto-deploy on push"

      - name: Optimization status
        if: steps.check_changes.outputs.files_changed == 'false'
        run: |
          echo "✅ OPTIMIZATION WORKING"
          echo "======================="
          echo "No changes detected - skipping commit & deploy"
          echo "This reduces:"
          echo "  • Git commits (clean history)"
          echo "  • Cloudflare Pages deployments"
          echo "  • Unnecessary CDN cache purges"
