<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Loading Website</title>
    <style>
        /* Base styles */
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
        }

        /* 1. Full-screen loading background */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }

        /* 2. The animated loading circle */
        .loader {
            width: 45px;
            height: 45px;
            border: 4px solid #e2e8f0;
            border-top: 4px solid #2563eb; /* Blue accent color */
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        /* Loading text below the spinner */
        .loading-text {
            margin-top: 15px;
            font-size: 14px;
            color: #64748b;
            letter-spacing: 0.5px;
        }

        /* 3. Spinner rotation movement */
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Class triggered by JavaScript to smoothly hide the screen */
        .hidden {
            opacity: 0;
            visibility: hidden;
        }

        /* Basic container layout for your website content */
        .main-content {
            max-width: 600px;
            margin: 80px auto;
            padding: 30px;
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- LOADING SCREEN OVERLAY -->
    <div id="loading-screen">
        <div class="loader"></div>
        <div class="loading-text">Loading page...</div>
    </div>

    <!-- MAIN WEBSITE CONTENT -->
    <div class="main-content">
        <h1>Welcome to My Site</h1>
        <p>This simple web page successfully loaded all of its assets.</p>
    </div>

    <!-- JAVASCRIPT TO CONTROL THE HIDDEN CLASS -->
    <script>
        window.addEventListener('load', function() {
            const screen = document.getElementById('loading-screen');
            screen.classList.add('hidden');
        });
    </script>

</body>
</html>
