<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found | ToxicBro Official</title>
  <meta name="robots" content="noindex, follow" />
  <link rel="canonical" href="https://toxicbro.pages.dev/404" />
  <link rel="stylesheet" href="/fonts/site-fonts-secondary.css" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <style>
    :root{--r:#E8001C;--r2:#FF2A40;--text:#f4f4f4;--muted:#a5a5a5;--font-display:'Bebas Neue',sans-serif;--font-body:'Exo 2',sans-serif;}
    *{box-sizing:border-box;margin:0;padding:0}
    html{background:#050505;min-height:100vh;display:flex;align-items:center;justify-content:center}
    body{font-family:var(--font-body),sans-serif;background:radial-gradient(circle at 50% 50%,rgba(232,0,28,.12),transparent 40rem),linear-gradient(135deg,#050505,#0b0b0d);color:var(--text);text-align:center;padding:24px;line-height:1.6;width:100%}
    .code{font-family:var(--font-display);font-size:clamp(4rem,12vw,8rem);color:var(--r);text-shadow:0 0 40px rgba(232,0,28,.4);margin:0}
    h1{font-family:var(--font-display);font-size:clamp(1.5rem,4vw,2.5rem);margin:0 0 12px}
    p{color:var(--muted);max-width:500px;margin:0 auto 24px;font-size:1.05rem}
    a{display:inline-block;padding:12px 24px;background:linear-gradient(135deg,var(--r),var(--r2));color:#fff;text-decoration:none;border-radius:4px;font-weight:700;transition:transform .2s}
    a:hover{transform:translateY(-2px)}
  </style>
</head>
<body>
  <div class="code">404</div>
  <h1>Page Not Found</h1>
  <p>This page doesn't exist or may have moved. Let's get you back to the action.</p>
  <a href="/">← Back to Home</a>
</body>
</html>
